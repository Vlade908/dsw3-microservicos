services:
  event-broker:
    build:
      context: ./event-broker
      dockerfile: Dockerfile
    container_name: event-broker
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    volumes:
      - broker-data:/app/data
    networks:
      - dsw3-network
    restart: unless-stopped

  ms-produtos:
    build:
      context: ./ms-produtos
      dockerfile: Dockerfile
    container_name: ms-produtos
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=file:./data/dev.db
      - CORS_ORIGIN=http://localhost:3000
      - BROKER_URL=http://event-broker:3003
      - SERVICE_URL=http://ms-produtos:3001
    volumes:
      - produtos-data:/app/prisma/data
    depends_on:
      - event-broker
    networks:
      - dsw3-network
    restart: unless-stopped

  ms-pedidos:
    build:
      context: ./ms-pedidos
      dockerfile: Dockerfile
    container_name: ms-pedidos
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - PRODUTOS_SERVICE_URL=http://ms-produtos:3001
      - DATABASE_URL=file:./data/dev.db
      - CORS_ORIGIN=http://localhost:3000
      - BROKER_URL=http://event-broker:3003
      - SERVICE_URL=http://ms-pedidos:3002
    volumes:
      - pedidos-data:/app/prisma/data
    depends_on:
      - event-broker
    networks:
      - dsw3-network
    restart: unless-stopped

  ms-query:
    build:
      context: ./ms-query
      dockerfile: Dockerfile
    container_name: ms-query
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=file:./data/dev.db
      - CORS_ORIGIN=http://localhost:3000
      - BROKER_URL=http://event-broker:3003
      - SERVICE_URL=http://ms-query:3004
      - PRODUTOS_SERVICE_URL=http://ms-produtos:3001
      - PEDIDOS_SERVICE_URL=http://ms-pedidos:3002
    volumes:
      - query-data:/app/prisma/data
    depends_on:
      - event-broker
    networks:
      - dsw3-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-dsw3
    ports:
      - "3000:3000"
    depends_on:
      - ms-produtos
      - ms-pedidos
      - event-broker
      - ms-query
    networks:
      - dsw3-network
    restart: unless-stopped

volumes:
  produtos-data:
    driver: local
  pedidos-data:
    driver: local
  broker-data:
    driver: local
  query-data:
    driver: local

networks:
  dsw3-network:
    driver: bridge
